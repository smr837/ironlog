<style>
/* Layout: one phone-width column; sticky brand bar on top, tab bar + rest timer pinned to the bottom. Big tap targets for sweaty thumbs. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#E2E6EA; --ink:#13171C; --muted:#5A6470; --line:#D2D7DD;
  --accent:#C22F29; --accent-ink:#FFFFFF; --accent-soft:#F7DEDC;
  --good:#1D7F46; --good-bg:#DBF0E3; --warn:#8A5D00; --warn-bg:#FBF0D2;
  --p-red:#C22F29; --p-blue:#1E5DAD; --p-yellow:#C99700; --p-green:#2C8740; --p-purple:#6A4DB0; --p-orange:#CF5F1A; --p-steel:#59636F; --p-white:#B8C0C9;
  --heat0:#E2E6EA; --heat1:#F2B8B3; --heat2:#E2756D; --heat3:#C22F29;
  --f-display:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --sunk:#0B0E11; --ink:#E6E9ED; --muted:#98A1AC; --line:#2A3039;
  --accent:#EE5A4F; --accent-ink:#15181C; --accent-soft:#3A1D1B;
  --good:#4FC47C; --good-bg:#15301F; --warn:#E3B341; --warn-bg:#33290F;
  --p-red:#EE5A4F; --p-blue:#4F8BE0; --p-yellow:#E7B925; --p-green:#4DB463; --p-purple:#9A80E6; --p-orange:#F08544; --p-steel:#8A95A3; --p-white:#D5DBE2;
  --heat0:#1F242B; --heat1:#5A2724; --heat2:#9E3B33; --heat3:#EE5A4F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --sunk:#0B0E11; --ink:#E6E9ED; --muted:#98A1AC; --line:#2A3039;
  --accent:#EE5A4F; --accent-ink:#15181C; --accent-soft:#3A1D1B;
  --good:#4FC47C; --good-bg:#15301F; --warn:#E3B341; --warn-bg:#33290F;
  --p-red:#EE5A4F; --p-blue:#4F8BE0; --p-yellow:#E7B925; --p-green:#4DB463; --p-purple:#9A80E6; --p-orange:#F08544; --p-steel:#8A95A3; --p-white:#D5DBE2;
  --heat0:#1F242B; --heat1:#5A2724; --heat2:#9E3B33; --heat3:#EE5A4F;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:2px;background:var(--accent);box-shadow:5px 0 0 -1px var(--p-blue)}
.sync{font-size:.75rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.err{color:var(--accent)}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 16px;font-weight:600;min-height:46px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);background:transparent}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:1.15rem;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.btn.sm{padding:6px 12px;font-size:.9rem;min-height:40px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:8px 4px;color:var(--muted);font-weight:600;font-size:.9rem;min-height:40px}
.linkbtn:hover{color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hot{border:2px solid var(--accent)}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-weight:600}
.badge{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.badge.good{background:var(--good-bg);color:var(--good)}

.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tpl:hover{border-color:var(--muted)}
.tpl b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.02em}
.tpl span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stats>div{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}

/* active workout */
.wk-bar{display:flex;gap:8px;align-items:center}
.wk-bar .sp{flex:1}
.paused{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-weight:600}
.wk-head{display:flex;flex-direction:column;gap:8px}
#wk-name{font-family:var(--f-display);font-weight:700;font-size:1.9rem;border:0;background:transparent;padding:0;width:100%;border-bottom:2px solid transparent}
#wk-name:focus{outline:none;border-bottom-color:var(--accent)}
.wk-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.92rem;color:var(--muted)}
.wk-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.wk-meta label{display:flex;gap:6px;align-items:center;margin-left:auto}
.wk-meta select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ex.grouped{border-left:6px solid var(--p-blue)}
.grp{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--p-blue)}
.ex-h{display:flex;align-items:center;gap:10px;min-width:0}
.ex-h h3{flex:1;min-width:0;overflow-wrap:anywhere}
.ex-h h3 button{all:unset;cursor:pointer}
.ex-h h3 button:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.plate-dot{flex:none;width:12px;height:26px;border-radius:3px;background:var(--c)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.ex-menu{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--sunk);border-radius:10px}
.sug{font-size:.88rem;border-radius:8px;padding:6px 10px;background:var(--sunk)}
.sug.up{background:var(--good-bg);color:var(--good);font-weight:600}
.pin{font-size:.88rem;background:var(--sunk);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.pin b{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px}

.sets{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:var(--cols);gap:6px;align-items:center;padding:3px 4px;border-radius:10px}
.row.head{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-block:0}
.row.head span:not(:first-child):not(.pv){text-align:center}
.row .n{font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-align:center;color:var(--muted)}
.row .pv{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;min-width:0}
.row input{width:100%;min-width:0;height:44px;text-align:center;border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:0 2px;font-weight:600;font-variant-numeric:tabular-nums}
.row input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.row.cur{background:var(--accent-soft)}
.tcell{display:flex;gap:3px;min-width:0}
.tcell button{flex:none;width:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:.7rem;color:var(--muted)}
.tcell button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chk{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.chk:hover{border-color:var(--good);color:var(--good)}
.row.done{background:var(--good-bg)}
.row.done input{background:transparent;border-color:transparent}
.row.done .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.row.done .n{color:var(--good)}
.pr{font-size:.62rem;font-weight:800;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ex-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.next{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--sunk)}
.steppers{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:flex;align-items:center;gap:4px;flex:1;min-width:140px}
.stp button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700;flex:none}
.stp button:active{background:var(--accent-soft)}
.stp .v{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
.stp .v small{display:block;font-family:var(--f-body);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.note{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:16px;color:var(--ink)}
.note:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.hnote{font-size:.88rem;color:var(--muted);margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

.plates{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--sunk);border-radius:10px;font-size:.88rem}
.bar{display:flex;align-items:center;min-height:64px;overflow-x:auto}
.bar .sleeve{width:26px;height:10px;background:var(--p-steel);border-radius:2px 0 0 2px;flex:none}
.bar .shaft{flex:1;min-width:30px;height:6px;background:var(--p-steel);opacity:.6}
.bar .disc{flex:none;width:13px;margin-right:2px;border-radius:3px;background:var(--c);display:grid;place-items:center;font-size:.55rem;font-weight:800;color:var(--surface);writing-mode:vertical-rl}
.bar .collar{flex:none;width:6px;height:22px;background:var(--muted);border-radius:2px;margin-right:2px}
.add-ex{border:2px dashed var(--line);background:transparent;border-radius:var(--r);padding:14px;font-weight:700;color:var(--muted);font-family:var(--f-display);font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;min-height:56px}
.add-ex:hover{border-color:var(--accent);color:var(--accent)}

/* guided */
.g-prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.g-prog i{display:block;height:100%;background:var(--accent)}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.g-name{font-size:2.4rem}
.g-set{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--muted)}
.g-fields{display:flex;flex-direction:column;gap:12px}
.g-field{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:8px;align-items:center}
.g-field button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);font-size:1.8rem;font-weight:700}
.g-field button:active{background:var(--accent-soft)}
.g-field label{display:flex;flex-direction:column;align-items:center;gap:2px}
.g-field input{width:100%;height:64px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:14px;font-family:var(--f-display);font-weight:800;font-size:2.2rem;font-variant-numeric:tabular-nums}
.g-field input:focus{outline:none;border-color:var(--accent)}
.g-field small{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.g-rest{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.g-rest .t{font-family:var(--f-display);font-weight:800;font-size:5.5rem;line-height:1;font-variant-numeric:tabular-nums}
.g-rest.over .t{color:var(--good)}
.g-rest .ex-f{justify-content:center}

/* history + lists */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hcard>button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;width:100%;box-sizing:border-box}
.hcard>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hlist{margin:0;padding:0;list-style:none;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.hlist li{display:flex;justify-content:space-between;gap:10px}
.hlist li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hdetail{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.hdetail h4{margin:0 0 4px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:6px;padding:2px 8px}
.chip.prc{background:var(--accent-soft);color:var(--accent);font-weight:700}
.month{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}

/* library */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:6px}
.filters button i{width:7px;height:14px;border-radius:2px;background:var(--c)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:flex;flex-direction:column;gap:14px}
.lib-group{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lib-group>.gh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lib-item{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-top:1px solid var(--line);min-height:28px}
.lib-item:first-of-type{border-top:0}
.lib-item:hover{background:var(--sunk)}
.lib-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lib-item .nm{font-weight:600;min-width:0}
.lib-item .nm small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.lib-item .bst{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lib-item.sel{background:var(--accent-soft)}
.lib-item.sel .nm::after{content:" ✓";color:var(--accent)}
.lib-item.off .nm{opacity:.55}

.det-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.det-stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.det-stats b{font-family:var(--f-display);font-size:1.7rem;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.det-stats span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end,.chart .bar-f{fill:var(--accent)}
.chart .bar-o{fill:var(--sunk)}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart text.lbl{fill:var(--ink);font-weight:700;font-size:13px}
.chart select{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px;width:100%}
.heat{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.heat span{font-size:.62rem;color:var(--muted);padding-right:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--heat0);max-width:100%}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}
.heat i.today{outline:2px solid var(--ink);outline-offset:-2px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach>div{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.ach>div.lock{background:transparent;border-style:dashed}
.ach>div.lock b{color:var(--muted)}
.ach b{font-family:var(--f-display);font-size:1.1rem}
.ach small{font-size:.78rem;color:var(--muted)}
.medal{width:26px;height:26px;border-radius:50%;background:var(--p-yellow);display:grid;place-items:center;color:var(--surface);font-weight:800;font-size:.8rem}
.lock .medal{background:var(--sunk);color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter.done i{background:var(--good)}
.chal{display:flex;flex-direction:column;gap:6px}
.chal .hrow span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.form .fr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .fr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;color:var(--ink);font-weight:500;width:100%;min-height:44px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;min-height:0}
.opt span{display:inline-flex;align-items:center;min-height:42px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;color:var(--ink);font-size:.92rem}
.opt input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
details.prog summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem;padding:4px 0;list-style-position:inside}
.daylist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.daylist div{font-size:.88rem}
.daylist b{display:block;font-family:var(--f-display);font-size:1.05rem}

/* bottom chrome */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);position:relative}
.rest .t{font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;min-width:4.2ch}
.rest .lab{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0}
.rest .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--accent);transition:width .25s linear}
.rest.over .t{color:var(--good)}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:relative;min-height:56px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tabs .live{font-variant-numeric:tabular-nums;color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgb(10 12 15 / .5)}
.sheet-p{background:var(--bg);width:100%;max-width:640px;max-height:90%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sheet-h h2{flex:1}
.sheet-b{overflow-y:auto;padding:0 16px 12px;display:flex;flex-direction:column;gap:12px}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column}
.sum b{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.sum span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:1.8rem}.g-name{font-size:2rem}.tpl-grid{grid-template-columns:1fr}.tabs button{font-size:.58rem}}
</style>

function fmtSet(type,s){
  if(!s) return '';
  switch(type){
    case 'weight': return (s.w!=null||s.r!=null) ? `${wOut(s.w)||'–'} × ${s.r??'–'}` : '';
    case 'bw': return s.r==null ? '' : (s.w ? `+${wOut(s.w)} × ${s.r}` : `${s.r} reps`);
    case 'time': return fmtTime(s.t);
    case 'cardio': return [s.d!=null?`${dOut(s.d)} ${dUnit()}`:'', fmtTime(s.t)].filter(Boolean).join(' · ');
    case 'carry': return [s.w!=null?`${wOut(s.w)} ${S.unit}`:'', fmtTime(s.t)].filter(Boolean).join(' · ');
  }
  return '';
}
const e1rm = (w,r) => (!w||!r) ? 0 : (r===1 ? w : w*(1+r/30));
function score(type,s){
  if(!s) return 0;
  switch(type){
    case 'weight': return e1rm(s.w,s.r);
    case 'bw': return (s.r||0) + (s.w||0)/1000;
    case 'time': return s.t||0;
    case 'cardio': return s.d||s.t||0;
    case 'carry': return (s.w||0)*(s.t||0);
  }
  return 0;
}

}

const sortedWorkouts = () => Object.values(S.workouts).sort((a,b)=>b.startedAt-a.startedAt);
function prevSets(exId){ for(const w of sortedWorkouts()){ const e=w.entries.find(e=>e.exId===exId); if(e&&e.sets.length) return e.sets } return null }
function sessionsFor(exId){ const out=[]; for(const w of sortedWorkouts()) for(const e of w.entries) if(e.exId===exId) out.push({w,sets:e.sets,note:e.note||''}); return out }

/* ================= progressive overload ================= */
function incFor(ex){
  const lower = ex.cat==='Legs' || ['deadlift','clean'].includes(ex.id);
  if(S.unit==='lb') return (ex.equip==='Barbell' && lower ? 10 : 5)*KG_LB;
  return ex.equip==='Barbell' ? (lower?5:2.5) : 2;
}
function suggest(exId,target){
  const ex=exById(exId), last=sessionsFor(exId).find(x=>x.sets.length); if(!last) return null;
  const hi=tHigh(target), sets=last.sets;
  if(ex.type==='weight'){
    const w=Math.max(...sets.map(s=>s.w||0)); if(!w) return null;
    const top=sets.filter(s=>(s.w||0)>=w-1e-6);
    const goal = hi ?? (top[0].r||0);
    const hit = top.length>=1 && top.every(s=>(s.r||0)>=goal) && (hi!=null || sets.length>=2);
    if(hit){ const inc=incFor(ex); return {w:w+inc, up:true, msg:`Add ${wOut(inc)} ${S.unit}: you hit every rep last time (${fmtSet('weight',top[0])}).`} }
    return {w, up:false, msg:`Stay at ${wOut(w)} ${S.unit} and beat last time's reps.`};
  }
  if(ex.type==='bw'){ const r=Math.max(...sets.map(s=>s.r||0)); if(!r) return null;
    if(hi!=null && sets.every(s=>(s.r||0)>=hi)) return {r:hi, up:true, msg:`You hit ${hi} reps on every set. Add ${S.unit==='lb'?'5 lb':'2.5 kg'} of weight or slow the tempo.`};
    const nr=hi!=null?Math.min(r+1,hi):r+1; return {r:nr, up:true, msg:`Aim for ${nr} reps per set (+1 on last time).`} }
  if(ex.type==='time'){ const t=Math.max(...sets.map(s=>s.t||0)); if(!t) return null; return {t:t+5, up:true, msg:`Hold for ${fmtTime(t+5)} (+5 s on last time).`} }
  return null;
}

async function flush(id){

const newSet = () => ({w:null,r:null,t:null,d:null,done:false});
function prefill(s,ex,i,prev,sug,target){
  const p=prev[i]||prev[prev.length-1]||{};
  if(ex.type==='weight'){ s.w = sug?.w ?? p.w ?? null; s.r = tLow(target) ?? p.r ?? null }
  else if(ex.type==='bw'){ s.w = p.w ?? null; s.r = sug?.r ?? tLow(target) ?? p.r ?? null }
  else if(ex.type==='time'){ s.t = target?.t ?? sug?.t ?? p.t ?? null }
  else if(ex.type==='cardio'){ s.d = target?.d ?? p.d ?? null; s.t = target ? null : (p.t ?? null) }
  else { s.w = p.w ?? null; s.t = p.t ?? null }
}
function makeEntry(exId,o={}){
  const ex=exById(exId), prev=prevSets(exId)||[];
  const n=o.sets || Math.min(prev.length || (ex.type==='cardio'?1:3), 8);
  const sug=suggest(exId,o.target);
  const sets=Array.from({length:n},(_,i)=>{ const s=newSet(); prefill(s,ex,i,prev,sug,o.target); return s });
  return {uid:uid(), exId, sets, note:'', group:o.group||null, rest:o.rest||null, target:o.target||null, sug:sug?{msg:sug.msg,up:sug.up}:null};
}

}
const startIds = (name,ids,extra) => startWorkout(name, ids.map(id=>makeEntry(adapt(id))), extra);
function programDay(p, idx){

    const id=adapt(x.ex), ex=exById(id);
    let sets=x.sets + (P().level==='advanced' && k<2 && ex.type==='weight' ? 1 : 0);
    if(x.grow) sets=Math.min(x.sets+Math.floor((week-1)/2),10);
    const target = x.reps!=null ? {reps:x.reps} : x.t ? {t:x.t+(week-1)*5} : x.d ? {d:Math.min(x.d.max, x.d.base+x.d.inc*(week-1))} : null;
    return makeEntry(id,{sets,target,rest:x.rest||null,group:x.group?idx+'-'+x.group:null});
  })};
}
function startProgram(guided){
  const p=PROGRAMS.find(x=>x.id===S.program?.id); if(!p) return;
  const {day,week,entries}=programDay(p,S.program.day||0);

const entryOf = uidv => S.active?.entries.find(e=>e.uid===uidv);
const elapsed = a => Math.max(0,(a.pausedAt||Date.now())-a.startedAt-(a.pausedMs||0));
function togglePause(){

const guardActive = () => { if(!S.active) return false; toast('End or resume your current workout first'); return true };

// supersets/circuits: consecutive entries that share a group run round by round
function blocks(){
  const L=S.active?.entries||[], out=[]; let k=0;
  while(k<L.length){ const g=L[k].group; let j=k+1; if(g) while(j<L.length && L[j].group===g) j++; out.push(L.slice(k,j)); k=j }
  return out;
}
function steps(){
  const out=[];
  for(const blk of blocks()){ const rounds=Math.max(...blk.map(e=>e.sets.length)); for(let r=0;r<rounds;r++) for(const e of blk) if(r<e.sets.length) out.push({e,i:r}) }
  return out;
}
const nextStep = () => steps().find(x=>!x.e.sets[x.i].done) || null;
function groupLabels(){
  const m={}; let n=0;
  for(const blk of blocks()) if(blk.length>1){ const L=String.fromCharCode(65+n++); blk.forEach((e,k)=>m[e.uid]={name:`${blk.length>2?'Circuit':'Superset'} ${L}`,pos:`${L}${k+1}`}) }
  return m;
}
function restFor(e,i){
  const ex=exById(e.exId);
  const blk=blocks().find(b=>b.includes(e));
  if(blk.length>1){ const last=[...blk].reverse().find(x=>x.sets.length>i); if(last!==e) return 0; return last.rest ?? S.rest }
  if(ex.type==='cardio' && !e.rest) return 0;
  return e.rest ?? S.rest;
}

function logSet(e,i){
  const s=e.sets[i], ex=exById(e.exId);
  if(s.done){ s.done=false; s.pr=false; saveActive(); render(); return }
  const src = prevSets(e.exId)?.[i] || e.sets[i-1];
  for(const f of FIELDS[ex.type]) if(s[f]==null && src && src[f]!=null) s[f]=src[f];
  const ok = (ex.type==='bw'||ex.type==='weight') ? s.r!=null : FIELDS[ex.type].some(f=>s[f]!=null);
  if(!ok){ shake(); toast(ex.type==='time'?'Enter a time first':ex.type==='cardio'?'Enter a distance or time first':'Enter your reps first'); return }
  if(SW && SW.uid===e.uid && SW.i===i) stopSW(true);
  const a=S.active; if(a.pausedAt){ a.pausedMs=(a.pausedMs||0)+Date.now()-a.pausedAt; a.pausedAt=null }
  s.done=true;
  let prior=histBest(e.exId);
  for(const x of a.entries) if(x.exId===e.exId) for(const o of x.sets) if(o!==s && o.done) prior=Math.max(prior,score(ex.type,o));
  s.pr = prior>0 && score(ex.type,s)>prior+1e-9;
  // carry the logged numbers forward to the next untouched set
  const nx=e.sets[i+1]; if(nx && !nx.done) for(const f of FIELDS[ex.type]) if(nx[f]==null) nx[f]=s[f];
  saveActive();
  const rest=restFor(e,i), nxt=nextStep();
  if(s.pr) toast(`New personal record on ${ex.name}!`);
  else if(!rest && nxt && nxt.e!==e) toast(`Next: ${exById(nxt.e.exId).name}`);
  if(rest && nxt) startRest(rest); else if(!nxt){ stopRest(); toast('Every set is done. End the workout to save it.') }
  render();
}
function shake(){ const el=document.querySelector('.g-card, .next'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake') }
function stepVal(e,i,f,dir){
  const s=e.sets[i], ex=exById(e.exId);
  if(f==='w'){ const cur=parseFloat(wOut(s.w))||0, st=S.unit==='lb'?5:2.5; s.w=wIn(String(Math.max(0,cur+dir*st))) }
  else if(f==='r') s.r=Math.max(0,(s.r||0)+dir);
  else if(f==='t'){ const st=(s.t||0)>=120?15:5; s.t=Math.max(0,(s.t||0)+dir*st) }
  else if(f==='d'){ const cur=parseFloat(dOut(s.d))||0; s.d=dIn(String(Math.max(0,Math.round((cur+dir*0.1)*10)/10))) }
  if(s.done){ s.done=false; s.pr=false }
  saveActive(); render();
}
function finishSummary(){
  const a=S.active; let sets=0, vol=0, prs=[];
  for(const e of a.entries){ const ex=exById(e.exId); for(const s of e.sets) if(s.done){ sets++; vol+=setVol(s); if(s.pr) prs.push(`${ex.name} ${fmtSet(ex.type,s)}`) } }
  return {sets,vol,prs,dur:elapsed(a)};
}
function saveWorkout(share){
  const a=S.active;
  const entries=a.entries.map(e=>{ const x={exId:e.exId,sets:e.sets.filter(s=>s.done).map(({w,r,t,d,pr})=>({w,r,t,d,pr:!!pr}))};
      const n=(e.note||'').trim(); if(n) x.note=n; if(e.group) x.group=e.group; return x }).filter(e=>e.sets.length||e.note);
  const w={id:a.id,name:a.name||defaultName(),startedAt:a.startedAt,endedAt:Date.now(),dur:elapsed(a),entries};
  if(a.programId){ w.programId=a.programId; if(S.program?.id===a.programId){ S.program.day=(a.programDay||0)+1; S.program.done=(S.program.done||0)+1; saveSettings() } }
  const before=achievements().filter(x=>x.got).map(x=>x.id);
  S.workouts[w.id]=w; S.active=null; UI.home=false; UI.guided=false; stopRest(); stopSW(true);
  put(w.id,w); saveActive(true);
  const fresh=achievements().filter(x=>x.got && !before.includes(x.id));
  closeSheet(); UI.tab='history'; UI.open={[w.id]:true}; render(); scrollTop(); releaseWake();
  toast(fresh.length ? `Workout saved · Achievement unlocked: ${fresh[0].name}` : 'Workout saved');
  if(share) shareWorkout(w);
}

function startRest(sec){ REST={end:Date.now()+sec*1000,total:sec,beeped:false,crossed:false}; $('#rest').hidden=UI.guided; clearInterval(restTick); restTick=setInterval(drawRest,250); drawRest() }

document.addEventListener('pointerdown',()=>{ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); else if(AC.state==='suspended') AC.resume() }catch(e){} },{passive:true});

  o.frequency.value=i===2?1320:880; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.17);

function weekCounts(){ const m=new Map(); for(const w of Object.values(S.workouts)){ const k=weekKey(w.startedAt); m.set(k,(m.get(k)||0)+1) } return m }
function streaks(){
  const m=weekCounts(), goal=weeklyGoal(), thisWk=weekKey(Date.now());
  const prevWk = k => { const d=new Date(k); d.setDate(d.getDate()-7); return d.getTime() };
  let k = (m.get(thisWk)||0)>=goal ? thisWk : prevWk(thisWk), cur=0;
  while((m.get(k)||0)>=goal){ cur++; k=prevWk(k) }
  const keys=[...m.keys()].sort((a,b)=>a-b); let best=0, run=0, last=null;
  for(const kk of keys){ if((m.get(kk)||0)>=goal){ run = (last!=null && prevWk(kk)===last) ? run+1 : 1; last=kk; best=Math.max(best,run) } }
  return {cur, best:Math.max(best,cur), thisWeek:m.get(thisWk)||0, goal};
}
function totals(){
  let vol=0, prs=0, sets=0, km=0, notes=0, early=false, late=false, supers=false, prog=0;
  for(const w of Object.values(S.workouts)){
    const h=new Date(w.startedAt).getHours(); if(h<7) early=true; if(h>=21) late=true; if(w.programId) prog++;
    for(const e of w.entries){ if(e.note) notes++; if(e.group) supers=true; for(const s of e.sets){ sets++; vol+=setVol(s); if(s.pr) prs++; if(exById(e.exId).type==='cardio') km+=s.d||0 } }
  }
  return {n:Object.keys(S.workouts).length, vol, prs, sets, km, notes, early, late, supers, prog};
}

function platesHTML(e){
  const lb=S.unit==='lb', bar=lb?45:20;
  const sizes=lb?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  const col=lb?{45:'--p-blue',35:'--p-yellow',25:'--p-green',10:'--p-white',5:'--p-red',2.5:'--p-steel'}:{25:'--p-red',20:'--p-blue',15:'--p-yellow',10:'--p-green',5:'--p-white',2.5:'--p-red',1.25:'--p-steel'};
  const hts=lb?{45:60,35:54,25:46,10:36,5:28,2.5:22}:{25:60,20:60,15:54,10:46,5:34,2.5:26,1.25:22};
  const nx=e.sets.find(s=>!s.done && s.w!=null) || [...e.sets].reverse().find(s=>s.w!=null);
  if(!nx) return `<span class="muted">Enter a weight to see which plates to load. Assumes a ${bar} ${S.unit} bar.</span>`;
  const total=parseFloat(wOut(nx.w));
  let side=(total-bar)/2; if(side<0) return `<span>${total} ${S.unit} is less than the ${bar} ${S.unit} bar.</span>`;
  const load=[]; for(const p of sizes){ while(side>=p-1e-6){ load.push(p); side-=p } }
  const rest=Math.round(side*100)/100;
  return `<div><b>${total} ${S.unit}</b> <span class="muted">= ${bar} ${S.unit} bar + per side:</span> <b class="num">${load.length?load.join(' + '):'nothing'}</b>${rest>0?` <span class="muted">(${rest} ${S.unit} short)</span>`:''}</div>
    <div class="bar" aria-hidden="true"><span class="sleeve"></span><span class="collar"></span>${load.map(p=>`<span class="disc" style="--c:var(${col[p]});height:${hts[p]}px">${p>=10?p:''}</span>`).join('')}<span class="shaft"></span></div>`;
}

function viewProgress(){
  const T=totals(), st=streaks(), ws=sortedWorkouts();
  // 12-week heatmap, Monday rows

  let heat=''; const today=dayKey(Date.now());

function barsSVG(weeks){
  const W=600,H=200,L=50,R=10,T=14,B=26, max=Math.max(1,...weeks.map(w=>volOut(w.v)));
  const bw=(W-L-R)/weeks.length, Y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max], f=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':Math.round(v);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly training volume">${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${f(v)}</text>`).join('')}
    ${weeks.map((w,i)=>{ const v=volOut(w.v), x=L+i*bw+bw*.18, h=(H-T-B)-(Y(v)-T); return `<rect class="${i===weeks.length-1?'bar-f':'bar-f'}" ${i<weeks.length-1?'opacity=".55"':''} x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3"><title>${fmtDate(w.k)}: ${Math.round(v).toLocaleString()} ${S.unit}, ${w.n} workouts</title></rect>` }).join('')}
    <text x="${L}" y="${H-6}">${fmtDate(weeks[0].k)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">This week</text></svg>`;
}
function liftChart(id){
  const ex=exById(id), t=ex.type, ss=sessionsFor(id);
  const pts=ss.slice().reverse().map(x=>({x:x.w.startedAt,y:x.sets.reduce((a,s)=>Math.max(a,score(t,s)),0)})).filter(p=>p.y>0).slice(-20);
  const yl={weight:v=>wOut(v),bw:v=>String(Math.round(v)),time:v=>fmtTime(v),cardio:v=>dOut(v),carry:v=>String(Math.round(v))}[t];
  const lab={weight:`Best estimated 1-rep max (${S.unit})`,bw:'Most reps in a set',time:'Longest set',cardio:`Longest distance (${dUnit()})`,carry:'Best weight × seconds'}[t];
  return `<p class="muted" style="font-size:.85rem">${lab}</p>${chartSVG(pts,yl)}`;
}
const BODY = [['weight','Body weight',()=>S.unit],['bf','Body fat',()=>'%'],['waist','Waist',lUnit],['chest','Chest',lUnit],['arm','Arm',lUnit],['thigh','Thigh',lUnit]];
const bOut = (k,v) => v==null?'':k==='weight'?wOut(v):k==='bf'?r1(v):lOut(v);
const bIn = (k,s) => k==='weight'?wIn(s):k==='bf'?(isFinite(parseFloat(s))&&parseFloat(s)>0?parseFloat(s):null):lIn(s);
function bodySection(){

    ${chartSVG(pts,v=>bOut(m,v))}

  </div></section>`;

function chartSVG(pts,yl){
  if(pts.length<2) return `<p class="muted">Log this two or more times to see a trend.</p>`;
  const W=600,H=220,L=56,R=20,T=24,B=30;
  let lo=Math.min(...pts.map(p=>p.y)), hi=Math.max(...pts.map(p=>p.y));
  if(hi-lo<1e-6){ lo=lo*0.9; hi=hi*1.1||1 } const pad=(hi-lo)*0.12; lo=Math.max(0,lo-pad); hi+=pad;
  const X=i=>L+(W-L-R)*i/(pts.length-1), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=`${line}L${X(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const last=pts[pts.length-1], lx=X(pts.length-1), ly=Y(last.y);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend over ${pts.length} entries, latest ${esc(yl(last.y))}">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${esc(yl(v))}</text>`).join('')}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.slice(0,-1).map((p,i)=>`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"/>`).join('')}
    <circle class="end" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5.5"/>
    <text class="lbl" x="${(lx-8).toFixed(1)}" y="${(ly-12).toFixed(1)}" text-anchor="end">${esc(yl(last.y))}</text>
    <text x="${L}" y="${H-8}">${fmtDate(pts[0].x)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(last.x)}</text>
  </svg>`;
}

/* ---------- history ---------- */
function viewHistory(){
  const ws=sortedWorkouts();
  if(!ws.length) return `<h1>History</h1><div class="empty">Finished workouts show up here with every set, your notes and any personal records.<br><br><button type="button" class="btn primary" data-act="tab" data-tab="today">Start a workout</button></div>`;
  let out='<h1>History</h1>', month='';
  for(const w of ws){
    const m=new Date(w.startedAt).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    if(m!==month){ out+=`<div class="month">${m}</div>`; month=m }
    const sets=w.entries.reduce((a,e)=>a+e.sets.length,0), vol=w.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+setVol(s),0),0);
    const prs=w.entries.reduce((a,e)=>a+e.sets.filter(s=>s.pr).length,0), open=UI.open[w.id];
    out+=`<article class="hcard" data-wid="${esc(w.id)}">
      <button type="button" data-act="hopen" aria-expanded="${!!open}">
        <div class="hrow"><h3>${esc(w.name)}</h3><span class="muted num" style="font-size:.85rem;white-space:nowrap">${fmtDate(w.startedAt,{weekday:'short',month:'short',day:'numeric'})}</span></div>
        <div class="hmeta"><span>${fmtDur(w.dur ?? ((w.endedAt||w.startedAt)-w.startedAt))}</span><span>${sets} sets</span>${vol?`<span>${fmtVol(vol)} ${S.unit}</span>`:''}${prs?`<span style="color:var(--accent);font-weight:700">${prs} PR${prs>1?'s':''}</span>`:''}</div>
        ${open?'':`<ul class="hlist">${w.entries.map(e=>{ const ex=exById(e.exId); const best=e.sets.reduce((b,s)=>score(ex.type,s)>score(ex.type,b)?s:b,e.sets[0]);
          return `<li><span>${e.sets.length} × ${esc(ex.name)}${e.note?' <span class="muted">· note</span>':''}</span><span>${esc(fmtSet(ex.type,best))}</span></li>` }).join('')}</ul>`}
      </button>
      ${open?`<div class="hdetail">
        ${w.entries.map(e=>{ const ex=exById(e.exId); return `<div><h4>${esc(ex.name)}</h4><div class="chips">${e.sets.map(s=>`<span class="chip ${s.pr?'prc':''}">${esc(fmtSet(ex.type,s))}${s.pr?' · PR':''}</span>`).join('')}</div>${e.note?`<p class="hnote">${esc(e.note)}</p>`:''}</div>` }).join('')}
        <div class="ex-f"><button type="button" class="btn sm" data-act="repeat-w">Do again</button><button type="button" class="btn sm" data-act="share-w">Share</button>
        <button type="button" class="btn sm danger ${UI.armed==='del:'+w.id?'armed':''}" data-act="del-w">${UI.armed==='del:'+w.id?'Tap to delete':'Delete'}</button></div>
      </div>`:''}
    </article>`;
  }
  return out;
}

/* ================= files, sharing ================= */
async function saveFile(name,data,mime){
  if(DL){ try{ await DL.save({filename:name,data}); toast('Saved'); return true }catch(e){ if(e?.code==='declined') return false } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},1000); return true }catch(e){ toast('Your browser blocked the download'); return false }
}
function appLink(){ return /claude/.test(location.hostname) ? '' : location.href.split('#')[0] }
async function shareText(text){
  try{ if(navigator.share){ await navigator.share({text}); return } }catch(e){ if(e?.name==='AbortError') return }
  try{ await navigator.clipboard.writeText(text); toast('Copied. Paste it into any chat.'); return }catch(e){}
  openSheet(`<div class="sheet-h"><h2>Share</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="sheet-b"><p class="muted">Copy this text and send it to a friend.</p><textarea class="note" style="min-height:180px" readonly id="share-txt">${esc(text)}</textarea></div>`);
  setTimeout(()=>{ const t=$('#share-txt'); t?.focus(); t?.select() },50);
}
function shareWorkout(w){
  const lines=w.entries.filter(e=>e.sets.length).map(e=>{ const ex=exById(e.exId); return `• ${ex.name}: ${e.sets.map(s=>fmtSet(ex.type,s)+(s.pr?' (PR)':'')).join(', ')}` });
  const vol=w.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+setVol(s),0),0);
  shareText(`${w.name} · ${fmtDate(w.startedAt,{weekday:'short',month:'short',day:'numeric'})}\n${fmtDur(w.dur??(w.endedAt-w.startedAt))}${vol?` · ${fmtVol(vol)} ${S.unit} lifted`:''}\n${lines.join('\n')}\n\nLogged with Ironlog${appLink()?' '+appLink():''}`);
}
function buildICS(){
  const p=P(), [hh,mm]=(p.time||'18:00').split(':').map(Number), BY=['SU','MO','TU','WE','TH','FR','SA'];
  const pad=n=>String(n).padStart(2,'0'), fmt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(hh)}${pad(mm)}00`;
  const ev=p.days.map(dw=>{ const d=new Date(); d.setDate(d.getDate()+((dw-d.getDay()+7)%7)); return `BEGIN:VEVENT\r\nUID:ironlog-${dw}-${Date.now()}@ironlog\r\nDTSTAMP:${fmt(new Date())}\r\nDTSTART:${fmt(d)}\r\nDURATION:PT1H\r\nRRULE:FREQ=WEEKLY;BYDAY=${BY[dw]}\r\nSUMMARY:Ironlog: training day\r\nDESCRIPTION:Time to train. Open Ironlog to start today's workout.\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Time to train\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT` });
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ironlog//EN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`;
}
async function importBackup(file){
  try{
    const v=JSON.parse(await file.text()); if(!v || typeof v!=='object' || !v.workouts) throw 0;
    let n=0; for(const [id,w] of Object.entries(v.workouts)) if(w&&w.entries&&!S.workouts[id]){ S.workouts[id]=w; put(id,w); n++ }
    for(const c of v.custom||[]) if(!S.custom.some(x=>x.id===c.id)) S.custom.push(c);
    S.notes={...(v.notes||{}),...(S.notes||{})};
    for(const b of v.body||[]) if(!S.body.some(x=>x.id===b.id)) S.body.push(b);
    if(v.profile?.set && !P().set) S.profile={...DEF_PROFILE,...v.profile};
    if(v.program && !S.program) S.program=v.program;
    saveSettings(); saveBody(); closeSheet(); render(); toast(`Restored ${n} workout${n===1?'':'s'}`);
  }catch(e){ toast('That file isn’t an Ironlog backup') }
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, card=b.closest('[data-uid]'), e=card&&entryOf(card.dataset.uid), row=b.closest('[data-i]'), i=row?+row.dataset.i:null;
  switch(act){
    case 'tab': UI.tab=b.dataset.tab; if(UI.tab==='library'){ UI.detail=null; UI.from=null } if(UI.tab==='today') UI.home=false; UI.armed=null; render(); scrollTop(); break;
    case 'settings': openSettings(); break;
    case 'profile': openProfile(); break;
    case 'profile-save': {
      const f=$('#profile-form'), val=n=>f.querySelector(`input[name="${n}"]:checked`)?.value;
      S.profile={set:true, goal:val('goal'), level:val('level'), equipment:val('equipment'),
        days:[...f.querySelectorAll('input[name="days"]:checked')].map(x=>+x.value), injuries:[...f.querySelectorAll('input[name="inj"]:checked')].map(x=>x.value), time:$('#pf-time').value||'18:00'};
      saveSettings(); closeSheet(); render(); toast(S.program?'Profile saved. Your program now fits it.':`Profile saved. Try ${PROGRAMS.find(x=>x.id===recommend()).name} in Programs.`); break }
    case 'start-empty': if(guardActive()) break; startWorkout(null,[]); openPicker(); break;
    case 'start-tpl': { if(guardActive()) break; const [n,ids]=TEMPLATES[+b.dataset.i]; startIds(n,ids); break }
    case 'repeat': { if(guardActive()) break; const w=sortedWorkouts()[0]; startWorkout(w.name,w.entries.map(e=>makeEntry(e.exId,{group:e.group?('r'+e.group):null}))); break }
    case 'repeat-w': { if(guardActive()) break; const w=S.workouts[b.closest('[data-wid]').dataset.wid]; startWorkout(w.name,w.entries.map(e=>makeEntry(e.exId,{group:e.group?('r'+e.group):null}))); break }
    case 'prog-pick': if(guardActive()) break; S.program={id:b.dataset.id, day:0, done:0, startedAt:Date.now()}; saveSettings(); UI.armed=null; render(); scrollTop(); toast('Program started. Your first day is ready.'); break;
    case 'prog-start': if(guardActive()) break; startProgram(!!b.dataset.g); break;
    case 'prog-leave': if(arm('leave')){ S.program=null; UI.armed=null; saveSettings(); render(); toast('You left the program') } break;
    case 'wk-back': UI.home=true; UI.menu=null; render(); scrollTop(); break;
    case 'resume-wk': UI.home=false; UI.tab='today'; render(); scrollTop(); break;
    case 'pause': togglePause(); break;
    case 'guided-on': UI.guided=true; S.active.guided=true; saveActive(); render(); scrollTop(); break;
    case 'guided-off': UI.guided=false; S.active.guided=false; saveActive(); render(); break;
    case 'add-ex': openPicker(); break;
    case 'menu': UI.menu = UI.menu===card.dataset.uid ? null : card.dataset.uid; render(); break;
    case 'move': { const L=S.active.entries, k=L.indexOf(e), j=k+(+b.dataset.d); [L[k],L[j]]=[L[j],L[k]]; L[k].group=null; L[j].group=null; saveActive(); render(); break }
    case 'link': { const L=S.active.entries, k=L.indexOf(e), nx=L[k+1];
      if(e.group && nx.group===e.group){ nx.group=null; if(!L[k-1]||L[k-1].group!==e.group) e.group=null }
      else { const g=e.group||nx.group||uid(); e.group=g; nx.group=g }
      UI.menu=null; saveActive(); render(); break }
    case 'swap': openPicker(e.uid); break;
    case 'plates': UI.plates[e.uid]=!UI.plates[e.uid]; render(); break;
    case 'rm-ex': S.active.entries=S.active.entries.filter(x=>x!==e); UI.menu=null; saveActive(); render(); break;
    case 'add-set': { const ls=e.sets[e.sets.length-1], s=newSet(); if(ls) for(const f of ['w','r','t','d']) s[f]=ls[f]; e.sets.push(s); saveActive(); render(); break }
    case 'rm-set': e.sets.pop(); saveActive(); render(); break;
    case 'done': logSet(e,i); break;
    case 'step': stepVal(e,i,b.dataset.f,+b.dataset.d); break;
    case 'skip-set': e.sets.splice(i,1); if(!e.sets.length) S.active.entries=S.active.entries.filter(x=>x!==e); saveActive(); render(); break;
    case 'sw': toggleSW(e.uid,i); break;
    case 'note-open': UI.noteOpen[e.uid]=true; render(); $('#note-'+e.uid)?.focus(); break;
    case 'finish': openFinish(); break;
    case 'discard': if(arm('discard')) discardWorkout(); break;
    case 'discard-now': discardWorkout(); break;
    case 'discard-sheet': if(b.classList.contains('armed')) discardWorkout(); else { b.classList.add('armed'); b.textContent='Tap again to discard'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent='Discard this workout' } },4000) } break;
    case 'save-w': saveWorkout(false); break;
    case 'save-share': saveWorkout(true); break;
    case 'close': closeSheet(); break;
    case 'rest-adj': if(REST){ REST.end+=(+b.dataset.d)*1000; REST.total=Math.max(REST.total,(REST.end-Date.now())/1000); REST.beeped=false; drawRest() } break;
    case 'rest-skip': stopRest(); render(); break;
    case 'hopen': { const id=b.closest('[data-wid]').dataset.wid; UI.open[id]=!UI.open[id]; render(); break }
    case 'share-w': shareWorkout(S.workouts[b.closest('[data-wid]').dataset.wid]); break;
    case 'invite': { const c=challenges()[0]; shareText(`I'm training with Ironlog, a free workout tracker. This month's challenge: ${c.name}. Join me and let's see who gets there first.${appLink()?'\n'+appLink():''}`); break }
    case 'del-w': { const id=b.closest('[data-wid]').dataset.wid; if(arm('del:'+id)){ delete S.workouts[id]; UI.armed=null; put(id,null); render(); toast('Workout deleted') } break }
    case 'open-ex': UI.from = UI.tab==='library' ? null : UI.tab; UI.tab='library'; UI.detail=b.dataset.id; UI.armed=null; render(); scrollTop(); break;
    case 'back': UI.detail=null; UI.armed=null; if(UI.from){ UI.tab=UI.from; UI.from=null } render(); break;
    case 'lib-cat': UI.libCat=b.dataset.cat; $('#lib-list').innerHTML=libItems(UI.libQ,UI.libCat); b.parentElement.outerHTML=filterBar(UI.libCat,'lib-cat'); break;
    case 'pick-cat': UI.pickCat=b.dataset.cat; refreshPicker(); break;
    case 'pick': { const id=b.dataset.id; if(UI.swap){ UI.pick=new Set([id]) } else UI.pick.has(id)?UI.pick.delete(id):UI.pick.add(id); refreshPicker(); break }
    case 'pick-go': {
      if(UI.swap){ const old=entryOf(UI.swap), id=[...UI.pick][0]; if(old){ const ne=makeEntry(id,{sets:old.sets.length,target:old.target,rest:old.rest,group:old.group}); ne.note=old.note; S.active.entries[S.active.entries.indexOf(old)]=ne } UI.menu=null; closeSheet(); saveActive(); render(); toast('Exercise swapped'); break }
      for(const id of UI.pick) S.active.entries.push(makeEntry(id)); const n=UI.pick.size; closeSheet(); saveActive(); render(); toast(`Added ${n} exercise${n>1?'s':''}`); break }
    case 'add-this': S.active.entries.push(makeEntry(b.dataset.id)); saveActive(); UI.tab='today'; UI.home=false; UI.detail=null; render(); toast('Added to workout'); break;
    case 'start-this': startIds(null,[b.dataset.id]); break;
    case 'del-x': if(arm('delx')){ S.custom=S.custom.filter(c=>c.id!==b.dataset.id); UI.armed=null; UI.detail=null; saveSettings(); render(); toast('Removed from library') } break;
    case 'body-del': S.body=S.body.filter(x=>x.id!==b.dataset.id); saveBody(); render(); break;
    case 'export': saveFile(`ironlog-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({...S,active:null,exportedAt:Date.now()},null,1),'application/json'); break;
    case 'ics': if(!P().days.length){ toast('Pick training days in your profile first'); break } saveFile('ironlog-reminders.ics',buildICS(),'text/calendar').then(ok=>{ if(ok && !DL) toast('Open the downloaded file to add the reminders') }); break;
  }
});
$('#sheet').addEventListener('click',ev=>{ if(ev.target.id==='sheet') closeSheet() });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && !$('#sheet').hidden) closeSheet() });

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='wk-name'){ S.active.name=t.value; saveActive(); return }
  if(t.id==='lib-q'){ UI.libQ=t.value; $('#lib-list').innerHTML=libItems(UI.libQ,UI.libCat); return }
  if(t.id==='pick-q'){ UI.pickQ=t.value; refreshPicker(); return }
  if(t.dataset.note){ const e=entryOf(t.closest('[data-uid]').dataset.uid); if(e){ e.note=t.value; saveActive() } return }
  if(t.dataset.exnote){ S.notes=S.notes||{}; if(t.value.trim()) S.notes[t.dataset.exnote]=t.value; else delete S.notes[t.dataset.exnote]; saveSettingsSoon(); return }
  const f=t.dataset.f; if(!f) return;
  const card=t.closest('[data-uid]'), e=entryOf(card?.dataset.uid); if(!e) return;
  const i=+t.closest('[data-i]').dataset.i, s=e.sets[i];
  s[f] = f==='w'?wIn(t.value) : f==='r'?intIn(t.value) : f==='t'?parseTime(t.value) : dIn(t.value);
  if(f==='w' && UI.plates[e.uid]){ const pl=$('#pl-'+e.uid); if(pl) pl.innerHTML=platesHTML(e) }
  saveActive();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='rest-sel'){ S.rest=+t.value; saveSettings(); return }
  if(t.id==='prog-ex'){ UI.progEx=t.value; render(); return }
  if(t.id==='body-m'){ UI.bodyM=t.value; render(); return }
  if(t.id==='import-file' && t.files?.[0]){ importBackup(t.files[0]); return }
  if(t.name==='unit' && t.closest('#settings-form')){ S.unit=t.value; saveSettings(); render(); return }
  if(t.name==='theme' && t.closest('#settings-form')){ S.theme=t.value; applyTheme(); saveSettings(); return }
  if(t.dataset.f==='t'){ const v=parseTime(t.value); if(v!=null) t.value=fmtTime(v) }
  if(t.dataset.f && UI.guided) render();
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter' || !ev.target.dataset?.f) return;
  ev.preventDefault();
  const ins=[...document.querySelectorAll('.row input,.g-field input')], k=ins.indexOf(ev.target);
  (ins[k+1]||ev.target).blur();
  ins[k+1]?.focus();
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='cx-form'){
    const name=$('#cx-name').value.trim(); if(!name) return;
    const ex={id:'c-'+uid(),name,cat:$('#cx-cat').value,type:$('#cx-type').value,equip:$('#cx-equip').value,stress:''};
    S.custom.push(ex); saveSettings(); UI.libQ=''; UI.libCat=ex.cat; render(); toast(`Added ${name}`);
  }
  if(ev.target.id==='body-form'){
    const x={id:'b'+Date.now(),t:Date.now()}; let any=false;
    for(const [k] of BODY){ const v=bIn(k,$('#b-'+k).value); if(v!=null){ x[k]=v; any=true } }
    if(!any){ toast('Enter at least one measurement'); return }
    S.body=[...(S.body||[]),x]; saveBody(); if(x[UI.bodyM]==null) UI.bodyM=Object.keys(x).find(k=>BODY.some(b=>b[0]===k)); render(); toast('Measurements saved');
  }
});

boot();
</script>
